<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font: 13px/1.4 system-ui, sans-serif; width: 320px; margin: 0; padding: 12px; }
    h1 { font-size: 14px; margin: 0 0 8px; }
    #preview { border: 1px solid #ccc; border-radius: 6px; padding: 8px;
               height: 120px; overflow-y: auto; white-space: pre-wrap;
               color: #555; margin-bottom: 8px; }
    label { display: block; color: #666; font-size: 12px; margin-bottom: 2px; }
    input[type=text] { width: 100%; box-sizing: border-box; margin-bottom: 8px;
                       padding: 5px 7px; border: 1px solid #ccc; border-radius: 6px; }
    button { width: 100%; padding: 8px; border: 0; border-radius: 6px;
             background: #1c5e52; color: #fff; font-size: 13px; cursor: pointer; }
    button:disabled { background: #999; cursor: default; }
    #error { color: #b3402f; margin-top: 8px; min-height: 16px; }
  </style>
</head>
<body>
  <h1>fluency coach</h1>
  <div id="preview">…</div>
  <label for="server">coach server</label>
  <input type="text" id="server" spellcheck="false">
  <button id="start">start session</button>
  <div id="error"></div>
  <script src="popup.js"></script>
</body>
</html>
