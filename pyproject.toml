[project]
name = "fluency-coach"
version = "0.1.0"
description = "Local fluency coach. Your recorded voice is the reference; STT and TTS are swappable."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "nicegui",
    "numpy",
    "sounddevice",
    "soundfile",
    "librosa",
    "moondream>=2.4.0",
    "pykokoro",
    "httpx",
    "torch",
    "transformers",
    "phonemizer",
]

[project.scripts]
fluency-coach = "coach.main:main"
fluency-coach-ui = "coach.ui:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["coach*"]
